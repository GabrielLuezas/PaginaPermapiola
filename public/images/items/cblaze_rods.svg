<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="rodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#370617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireRod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffaa00"/>
      <stop offset="70%" stop-color="#d00000"/>
      <stop offset="100%" stop-color="#370617"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#120502"/>
  <circle cx="32" cy="32" r="26" fill="url(#rodGlow)"/>
  <!-- Cyclone swirl -->
  <path d="M14 48 C 12 24, 44 14, 48 30 C 52 44, 26 50, 20 40" fill="none" stroke="#ffaa00" stroke-width="2" opacity="0.6"/>
  <!-- Crossed Blaze Rods -->
  <rect x="29" y="10" width="6" height="44" rx="3" fill="url(#fireRod)" transform="rotate(45 32 32)" stroke="#ffd000" stroke-width="1.2"/>
  <rect x="29" y="10" width="6" height="44" rx="3" fill="url(#fireRod)" transform="rotate(-45 32 32)" stroke="#ffd000" stroke-width="1.2"/>
  <!-- Fire sparks -->
  <circle cx="20" cy="18" r="2" fill="#ffe600"/>
  <circle cx="46" cy="46" r="2" fill="#ffe600"/>
  <circle cx="48" cy="16" r="1.5" fill="#ff5400"/>
</svg>
