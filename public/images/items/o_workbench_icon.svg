<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Isometric Workbench Block Model -->
  <!-- Top Face -->
  <polygon points="64,24 104,44 64,64 24,44" fill="#a3704c" stroke="#68472b" stroke-width="2"/>
  <!-- Top Face Details (Planks) -->
  <line x1="44" y1="34" x2="84" y2="54" stroke="#8c5a2b" stroke-width="1.5"/>
  <line x1="54" y1="29" x2="94" y2="49" stroke="#8c5a2b" stroke-width="1.5"/>
  <!-- Top Slot Detail -->
  <polygon points="56,40 72,48 56,56 40,48" fill="#252538" stroke="#11111a" stroke-width="1.5"/>

  <!-- Left Green Trim -->
  <polygon points="24,44 64,64 64,74 24,54" fill="#2b9348" stroke="#1b4332" stroke-width="1.5"/>
  <!-- Right Green Trim -->
  <polygon points="64,64 104,44 104,54 64,74" fill="#38b000" stroke="#1b4332" stroke-width="1.5"/>

  <!-- Table Body Left -->
  <polygon points="24,54 64,74 64,90 24,70" fill="#68472b" stroke="#4a301c" stroke-width="1.5"/>
  <!-- Table Body Right -->
  <polygon points="64,74 104,54 104,70 64,90" fill="#8c5a2b" stroke="#4a301c" stroke-width="1.5"/>

  <!-- Legs -->
  <!-- Front Left Leg -->
  <polygon points="26,70 34,74 34,106 26,102" fill="#2b2d42" stroke="#11111a" stroke-width="1.5"/>
  <polygon points="34,74 38,72 38,104 34,106" fill="#11111a"/>
  
  <!-- Front Center Leg -->
  <polygon points="60,90 68,94 68,114 60,110" fill="#2b2d42" stroke="#11111a" stroke-width="1.5"/>
  <polygon points="68,94 72,92 72,112 68,114" fill="#11111a"/>

  <!-- Front Right Leg -->
  <polygon points="94,70 102,66 102,98 94,102" fill="#2b2d42" stroke="#11111a" stroke-width="1.5"/>

  <!-- Drop Shadow -->
  <ellipse cx="64" cy="114" rx="44" ry="10" fill="rgba(0,0,0,0.35)"/>
</svg>
