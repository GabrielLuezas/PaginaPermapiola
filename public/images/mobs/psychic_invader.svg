<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="psychicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#240046" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="huskDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c096c"/>
      <stop offset="50%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#10002b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#0b0314"/>
  <circle cx="32" cy="30" r="28" fill="url(#psychicGlow)"/>
  <!-- Psychic Waves -->
  <circle cx="32" cy="24" r="16" fill="none" stroke="#e0aaff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="32" cy="24" r="22" fill="none" stroke="#c77dff" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <!-- Husk Head -->
  <rect x="22" y="14" width="20" height="20" rx="3" fill="url(#huskDark)" stroke="#c77dff" stroke-width="1.5"/>
  <!-- Glowing Magenta Eyes -->
  <rect x="25" y="21" width="4" height="3" fill="#ff007f"/>
  <rect x="35" y="21" width="4" height="3" fill="#ff007f"/>
  <!-- Husk Body -->
  <rect x="25" y="34" width="14" height="18" rx="2" fill="#240046" stroke="#7b2cbf" stroke-width="1"/>
  <!-- Tentacles / Mind tendrils -->
  <path d="M22 40 Q 14 46 16 56" fill="none" stroke="#e0aaff" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 40 Q 50 46 48 56" fill="none" stroke="#e0aaff" stroke-width="2" stroke-linecap="round"/>
</svg>
